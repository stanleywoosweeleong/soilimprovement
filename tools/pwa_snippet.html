<style>
#pwa-toast{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);margin:0 auto;width:min(480px,calc(100% - 32px));z-index:60;display:flex;align-items:center;gap:10px;padding:10px 8px 10px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:.95rem;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#pwa-toast[hidden]{display:none}
#pwa-toast span{flex:1;min-width:0}
#pwa-toast button{flex:none;white-space:nowrap;font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 16px;min-height:40px;background:var(--accent);color:var(--bg);cursor:pointer}
#pwa-toast .x{background:transparent!important;color:inherit!important;font-size:1.3rem!important;padding:4px 8px!important;min-width:40px}
</style>
<script>
(function(){
  if(!('serviceWorker' in navigator))return;
  if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')return;
  var T={'en':['Saved on this device. Works offline.','A new version is available.','Update'],
         'zh-Hans':['已保存到本设备，可离线使用。','有新版本。','更新'],
         'zh-Hant':['已儲存到本裝置，可離線使用。','有新版本。','更新'],
         'ms':['Disimpan pada peranti ini. Boleh digunakan di luar talian.','Versi baharu tersedia.','Kemas kini']};
  function L(){return T[document.documentElement.lang]||T.en}
  var shown=null; /* [messageIndex, action] so the text can follow language switches */
  function draw(){var t=document.getElementById('pwa-toast');if(!t||!shown)return;var l=L();t.textContent='';
    var s=document.createElement('span');s.textContent=l[shown[0]];t.appendChild(s);
    if(shown[1]){var b=document.createElement('button');b.type='button';b.textContent=l[2];b.onclick=shown[1];t.appendChild(b)}
    var x=document.createElement('button');x.type='button';x.className='x';x.setAttribute('aria-label','×');x.textContent='×';x.onclick=function(){t.hidden=true;shown=null};t.appendChild(x)}
  function toast(i,onBtn){var t=document.getElementById('pwa-toast');if(!t){t=document.createElement('div');t.id='pwa-toast';t.setAttribute('data-noi18n','');t.setAttribute('role','status');document.body.appendChild(t)}
    shown=[i,onBtn||null];draw();t.hidden=false;if(!onBtn)setTimeout(function(){if(shown&&shown[0]===i&&!shown[1]){t.hidden=true;shown=null}},4500)}
  new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
  var wantReload=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(wantReload){wantReload=false;location.reload()}});
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js',{scope:'./'}).then(function(reg){
      var firstInstall=!navigator.serviceWorker.controller,seen=[];
      function offerUpdate(w){toast(1,function(){wantReload=true;w.postMessage('skipWaiting')})}
      function track(w){if(!w||seen.indexOf(w)>=0)return;seen.push(w);w.addEventListener('statechange',function(){
        if(w.state==='installed'&&navigator.serviceWorker.controller&&!firstInstall)offerUpdate(w);
        if(w.state==='activated'&&firstInstall){firstInstall=false;toast(0)}})}
      if(reg.waiting&&navigator.serviceWorker.controller)offerUpdate(reg.waiting);
      track(reg.installing);
      reg.addEventListener('updatefound',function(){track(reg.installing)});
      setInterval(function(){reg.update().catch(function(){})},3600000);
      function sendFonts(){var c=navigator.serviceWorker.controller;if(!c||!performance.getEntriesByType)return;
        var urls=performance.getEntriesByType('resource').map(function(e){return e.name}).filter(function(u){return /^https:\/\/fonts\.(googleapis|gstatic)\.com\//.test(u)});
        if(urls.length)c.postMessage({type:'cacheFonts',urls:urls})}
      if(navigator.serviceWorker.controller)setTimeout(sendFonts,3000);
      navigator.serviceWorker.addEventListener('controllerchange',function(){setTimeout(sendFonts,1000)});
    }).catch(function(){});
  });
})();
</script>
